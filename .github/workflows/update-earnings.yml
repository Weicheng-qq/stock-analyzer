# 每日法說會／財報自動更新
#
# 【為什麼用 GitHub Actions 而不是 Vercel Cron】
# 本 repo 是 public，public repo 使用 GitHub-hosted runner 是「免費且不計分鐘數」，
# 完全符合使用者「永久零費用、不綁任何付款方式」的硬性規定。
#
# 【流程】
#   1. detect-events：從 SEC 每日索引 + TWSE/TPEx 官方 OpenAPI 找出「今天真的有新事件」的公司
#      （一天只要幾個請求，而不是逐家掃描 5,000~6,000 家）
#   2. analyze-earnings：只分析佇列裡的公司，同一家同一季只分析一次，額度用完就停
#   3. 把結果 commit 回 repo → Cloudflare Pages 自動部署 → 所有使用者共用同一份分析
#
# 【費用保證】只使用 Gemini 免費層。免費層超額的行為是「拒絕請求」而非「開始計費」，
#   只要那個 Google Cloud 專案不啟用帳單，就不可能產生任何費用。

name: 每日法說會更新

on:
  schedule:
    # 台灣時間每天早上 7:00（UTC 23:00），台股法說會多在前一日盤後、美股財報多在美東盤後，
    # 這個時間點兩邊的新資料都已經出來了，使用者早上打開 App 就是最新的。
    # ⚠️ 2026-10-26 使用者要求「不設每天上限，只要免費就一直不停做」：
    #   一次執行最長約 5.5 小時（GitHub 單一工作上限 6 小時），做不完會「自己再觸發下一次」接著做（見最後一步），
    #   佇列做完或免費 AI 額度用盡才停。這個排程只是保險：每 3 小時檢查一次，
    #   前一輪還在跑就排隊（concurrency），沒事可做時 3～5 分鐘就結束。公開 repo 的 Actions 免費。
    - cron: '17 */3 * * *'
  workflow_dispatch:        # 允許手動觸發，方便測試與補跑
    inputs:
      max_analyses:
        description: '本次最多分析幾家公司（0＝不設上限；手動測試時才填數字）'
        required: false
        default: '0'
      lookback_days:
        description: 'SEC 回看天數'
        required: false
        default: '3'
      transcript_max:
        description: '本次最多用無頭瀏覽器抓幾家官網逐字稿'
        required: false
        default: '12'

# 只授予寫入 repo 內容的最小權限
permissions:
  contents: write
  actions: write      # 做不完時用 workflow_dispatch 自己再觸發下一輪（GITHUB_TOKEN 允許這一種，不會無限遞迴）

# 避免前一次還沒跑完就被下一次觸發，導致 commit 互相衝突
concurrency:
  group: update-earnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # ⚠️ 2026-10-10：原本 50 分鐘。AI 分析那一步常跑到 49 分鐘，一超時整個工作被 GitHub 強制取消，
    #   後面的「提交結果」被跳過 —— 最近 6 天有 5 天如此，當天分析好的內容全部沒存下來。
    #   現在三道保護：① 腳本自己看時間，34 分鐘就優雅收工（TIME_BUDGET_MIN）
    #                 ② AI 那一步另設 42 分鐘上限，超過只讓那一步失敗，不會取消整個工作
    #                 ③「提交結果」改成不論前面成功、失敗、逾時都會執行（if: always()）
    timeout-minutes: 350   # GitHub 上限 360；AI 分析那一步自己最多 335 分鐘
    steps:
      # v4 會觸發「Node.js 20 is deprecated」警告（GitHub 已強制改用 Node 24 執行），改用 v5
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 台股法說會簡報是 PDF，需要 pdftotext 轉純文字（poppler-utils 提供）
      - name: 安裝 PDF 文字擷取工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # 無頭瀏覽器：現代 IR 網站多為 JavaScript 動態渲染，純 fetch 抓到的是空殼
      #   （實測 NVIDIA 純 fetch 得到 0 個 PDF、用瀏覽器得到 10 個含逐字稿）。
      #   --only-shell 只裝精簡版 chromium，體積與時間都比完整版省很多。
      - name: 安裝無頭瀏覽器
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund --silent
          # 用「本地安裝的」playwright CLI，版本才會與 playwright-core 一致。
          #   直接 npx playwright 會臨時抓最新版，可能裝到不相容的 chromium。
          ./node_modules/.bin/playwright install --with-deps chromium --only-shell

      # 使用者指定的名額分配順序要用到「每家公司屬於哪個階段」。
      #   上市／上櫃名單每天從官方 API 重抓，新上市櫃的公司會自動歸入第三／第五階段；
      #   API 連不上時沿用上一次的名單，所以這一步失敗也不會讓排程中斷。
      - name: 更新五階段公司名單
        run: node scripts/build-stages.mjs || echo "⚠️ 五階段名單更新失敗，沿用舊名單"

      - name: 偵測新事件（SEC + TWSE + TPEx）
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
        run: node scripts/detect-events.mjs

      # ⚠️ 2026-10-26：改成「連續多輪」。每輪（約 30 分鐘）結束就先 commit＋push，結果不會因為後面逾時而遺失。
      #   每輪的結束狀態寫在 analyze-status.txt：
      #     continue＝因時間預算停、還有東西沒做 → 接著跑下一輪
      #     quota   ＝免費 AI 額度用盡 → 停（下一次排程再試；不會切換到任何付費模式）
      #     done    ＝佇列做完 → 停
      #     capped  ＝手動測試指定了上限 → 停
      #   整個工作累計跑到約 4 小時 45 分鐘就不再開新的一輪，剩下的交給「自己再觸發」。
      - name: AI 分析（持續處理，直到佇列做完或免費額度用盡）
        timeout-minutes: 335
        env:
          GH_TOKEN: ${{ github.token }}
          TIME_BUDGET_MIN: '30'
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          MAX_ANALYSES: ${{ github.event.inputs.max_analyses || '0' }}
          # 逐字稿路徑每家多花 15~30 秒；這是「每一輪」的上限，多輪累計後總量會隨輪數增加
          TRANSCRIPT_MAX: ${{ github.event.inputs.transcript_max || '12' }}
          NODE_PATH: scripts/node_modules
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          commit_push() {
            git add data/
            if git diff --staged --quiet; then echo "這一輪沒有新資料，不產生 commit"; return 0; fi
            n=$(git diff --staged --name-only | grep -cE "^data/(ai|earnings)/" || true)
            git commit -q -m "自動更新：新增 ${n} 家公司的法說會 AI 分析" \
              -m "由 GitHub Actions 排程產生，資料來源為 SEC EDGAR 與 TWSE/TPEx 官方 OpenAPI，AI 分析使用 Gemini／Groq 免費層。"
            git pull -q --rebase --autostash origin main && git push -q || { sleep 8; git pull -q --rebase --autostash origin main && git push -q; }
          }
          start=$(date +%s); status=done
          for i in $(seq 1 12); do
            echo "::group::第 $i 輪（已執行 $(( ($(date +%s)-start)/60 )) 分鐘）"
            rm -f analyze-status.txt
            node scripts/analyze-earnings.mjs || echo "⚠️ 這一輪結束碼不是 0，仍嘗試提交已完成的部分"
            echo "::endgroup::"
            commit_push || echo "⚠️ 這一輪的提交／推送失敗，已完成的內容留在硬碟，最後一步會再試一次"
            status=$(cat analyze-status.txt 2>/dev/null || echo done)
            echo "第 $i 輪狀態：$status"
            [ "$status" = "continue" ] || break
            [ $(( ($(date +%s)-start)/60 )) -ge 285 ] && { echo "已累計約 285 分鐘，不再開新的一輪"; break; }
          done
          echo "最後狀態：$status" | tee -a "$GITHUB_STEP_SUMMARY"
          # 做不完 → 自己再觸發下一次（只在正式排程／未指定上限、而且在 main 上時；有進度才會是 continue，不會空轉）
          if [ "$status" = "continue" ] && [ "${MAX_ANALYSES:-0}" = "0" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            gh workflow run update-earnings.yml --ref main && echo "已觸發下一次執行"
          fi

      - name: 提交結果（保險：前一步被強制中止時，至少把已完成的存下來）
        # 不論上一步成功、失敗或逾時都要提交：分析結果是一家一家寫進硬碟的，做了多少就存多少
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "沒有尚未提交的新資料"
          else
            n=$(git diff --staged --name-only | grep -cE "^data/(ai|earnings)/" || true)
            git commit -q -m "自動更新：新增 ${n} 家公司的法說會 AI 分析" \
              -m "由 GitHub Actions 排程產生，資料來源為 SEC EDGAR 與 TWSE/TPEx 官方 OpenAPI，AI 分析使用 Gemini／Groq 免費層。"
            git pull -q --rebase --autostash origin main
            git push -q
          fi
