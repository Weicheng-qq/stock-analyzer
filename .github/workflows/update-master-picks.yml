# 大師選股每週重算
#
# 【做什麼】每週一早上用最新的年度財報與本益比，重新替你的第一、二階段公司（約 770 家）評分，
#   每位大師台股／美股各取前 3 名，寫進 data/masters/*.json。
#   · 原本的 3 間若仍然最好就不變；有公司分數高出 3 分以上才替換（避免每週因小波動換來換去）
#   · 說明文字全部由數字套版，不使用 AI
#   詳細公式見 scripts/update-master-picks.mjs。
#
# 【零費用】public repo 的 GitHub Actions 免費；約 800 次網站代理請求，不用任何 AI 額度。
# 【失敗時】GitHub 會寄 email。資料來源異常（可評分的公司太少）時腳本會直接中止、不更新，
#   所以失敗不會把推薦改壞，App 會繼續顯示上一次的結果。

name: 大師選股每週重算

on:
  schedule:
    # 台灣時間每週一 05:20（UTC 週日 21:20）。年度財報一年才變一次，本益比每天變，一週一次足夠。
    - cron: '20 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-master-picks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 重新評分
        run: node scripts/update-master-picks.mjs

      - name: 提交結果
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/masters/
          if git diff --staged --quiet; then
            echo "評分結果與上次完全相同，不產生 commit"
          else
            git commit -m "自動更新：大師選股每週重算

          由 GitHub Actions 每週排程產生。資料來源為 Yahoo Finance 彙整之公司年度財報與目前本益比，
          說明文字由數字套版產生，未使用 AI。"
            git pull --rebase --autostash origin main
            git push
          fi
