# 編譯「隨手記帳」Android App（APK），放到 GitHub Release 讓手機直接下載安裝。
# 免費：public repo 的 GitHub Actions 不收費；不需要 Google Play 開發者帳號。
name: 記帳 App 編譯 APK

on:
  push:
    branches: [main, 'claude/expense-*']
    paths: ['expense/**', 'expense-android/**', '.github/workflows/build-expense-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expense-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 解析測試
        run: node expense/test/parse.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 自動更新用的版本指紋：畫面檔案（與 APK 內 assets/web 同一份清單）、Android 原始碼
      - name: 計算版本指紋
        run: |
          cd expense
          git -c core.quotepath=false ls-files | grep -v -E '^(交接清單/|test/|sw\.js$)' | sort > ../web-files.txt
          cd ..
          WEB_HASH=$(cd expense && while read f; do printf '%s ' "$f"; sha256sum "$f" | cut -d' ' -f1; done < ../web-files.txt | sha256sum | cut -d' ' -f1)
          NATIVE_HASH=$(git -c core.quotepath=false ls-files expense-android | sort | while read f; do printf '%s ' "$f"; sha256sum "$f" | cut -d' ' -f1; done | sha256sum | cut -d' ' -f1)
          echo "WEB_HASH=$WEB_HASH" >> $GITHUB_ENV
          echo "NATIVE_HASH=$NATIVE_HASH" >> $GITHUB_ENV
          echo "畫面 $WEB_HASH／主程式 $NATIVE_HASH"

      - name: 編譯 APK
        working-directory: expense-android
        run: gradle --no-daemon assembleRelease

      - name: 整理檔案
        run: cp expense-android/app/build/outputs/apk/release/app-release.apk expense-app.apk

      # 用 Android 官方工具確認簽章有效、看得到套件資訊，避免發出裝不起來的 APK
      - name: 驗證 APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs expense-app.apk
          $BT/aapt2 dump badging expense-app.apk | head -5

      # web.zip＋update.json：App 開啟時自動下載新版畫面（不用重裝 APK）
      - name: 打包自動更新檔
        run: |
          (cd expense && zip -q -X ../web.zip $(cat ../web-files.txt))
          WEB_ZIP_SHA=$(sha256sum web.zip | cut -d' ' -f1)
          printf '{"versionCode":%s,"webHash":"%s","nativeHash":"%s","webZipSha256":"%s","commit":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$WEB_HASH" "$NATIVE_HASH" "$WEB_ZIP_SHA" "$GITHUB_SHA" > update.json
          cat update.json
          unzip -l web.zip

      - uses: actions/upload-artifact@v4
        with:
          name: expense-app-apk
          path: expense-app.apk

      # 固定的 Release「expense-app-latest」：手機下載網址永遠不變
      - name: 更新下載頁
        uses: softprops/action-gh-release@v2
        with:
          tag_name: expense-app-latest
          name: 隨手記帳 Android App（最新版）
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            手機點下方 **expense-app.apk** 下載 → 開啟 → 允許「安裝不明來源的應用程式」→ 安裝。
            新版直接覆蓋安裝，記帳資料會保留。

            版本：1.0.${{ github.run_number }}（${{ github.ref_name }} @ ${{ github.sha }}）
          files: |
            expense-app.apk
            web.zip
            update.json
