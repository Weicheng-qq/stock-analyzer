# 每日法說會／財報自動更新
#
# 【為什麼用 GitHub Actions 而不是 Vercel Cron】
# 本 repo 是 public，public repo 使用 GitHub-hosted runner 是「免費且不計分鐘數」，
# 完全符合使用者「永久零費用、不綁任何付款方式」的硬性規定。
#
# 【流程】
#   1. detect-events：從 SEC 每日索引 + TWSE/TPEx 官方 OpenAPI 找出「今天真的有新事件」的公司
#      （一天只要幾個請求，而不是逐家掃描 5,000~6,000 家）
#   2. analyze-earnings：只分析佇列裡的公司，同一家同一季只分析一次，額度用完就停
#   3. 把結果 commit 回 repo → Vercel 自動部署 → 所有使用者共用同一份分析
#
# 【費用保證】只使用 Gemini 免費層。免費層超額的行為是「拒絕請求」而非「開始計費」，
#   只要那個 Google Cloud 專案不啟用帳單，就不可能產生任何費用。

name: 每日法說會更新

on:
  schedule:
    # 台灣時間每天早上 7:00（UTC 23:00），台股法說會多在前一日盤後、美股財報多在美東盤後，
    # 這個時間點兩邊的新資料都已經出來了，使用者早上打開 App 就是最新的。
    - cron: '0 23 * * *'
  workflow_dispatch:        # 允許手動觸發，方便測試與補跑
    inputs:
      max_analyses:
        description: '本次最多分析幾家公司'
        required: false
        default: '40'
      lookback_days:
        description: 'SEC 回看天數'
        required: false
        default: '3'
      transcript_max:
        description: '本次最多用無頭瀏覽器抓幾家官網逐字稿'
        required: false
        default: '12'
      daily_pool:
        description: '每日市場：股票池上限'
        required: false
        default: '60'
      daily_ai:
        description: '每日市場：最多幾次 AI 新聞判讀'
        required: false
        default: '25'

# 只授予寫入 repo 內容的最小權限
permissions:
  contents: write

# 避免前一次還沒跑完就被下一次觸發，導致 commit 互相衝突
concurrency:
  group: update-earnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # v4 會觸發「Node.js 20 is deprecated」警告（GitHub 已強制改用 Node 24 執行），改用 v5
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 台股法說會簡報是 PDF，需要 pdftotext 轉純文字（poppler-utils 提供）
      - name: 安裝 PDF 文字擷取工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # 無頭瀏覽器：現代 IR 網站多為 JavaScript 動態渲染，純 fetch 抓到的是空殼
      #   （實測 NVIDIA 純 fetch 得到 0 個 PDF、用瀏覽器得到 10 個含逐字稿）。
      #   --only-shell 只裝精簡版 chromium，體積與時間都比完整版省很多。
      - name: 安裝無頭瀏覽器
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund --silent
          # 用「本地安裝的」playwright CLI，版本才會與 playwright-core 一致。
          #   直接 npx playwright 會臨時抓最新版，可能裝到不相容的 chromium。
          ./node_modules/.bin/playwright install --with-deps chromium --only-shell

      - name: 偵測新事件（SEC + TWSE + TPEx）
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
        run: node scripts/detect-events.mjs

      # 【新增】每日市場資料（今日必看／我的股票今日變化／AI每日評分）
      #   ⚠️ 刻意排在「法說會分析」之前：兩者共用同一份 Gemini 每日免費額度，
      #   實測把法說會分析放前面時，額度會先被用光，導致每日市場的 AI 部分一次都跑不到
      #   （2026-08-30 首次執行：評分與重大異動正常，但今日必看 0 則、市場總結未產生）。
      #   每日市場是使用者每天打開 App 會看到的東西，應優先；法說會分析是背景補建，
      #   晚一點或明天再補都不影響體驗。
      #   獨立腳本，失敗也不該讓整個排程失敗，故加 continue-on-error
      - name: 產生每日市場資料
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          # 備援金鑰：Gemini 免費額度用完時自動改用，與網站 /api/ai 相同策略。
          #   沒設也能跑，只是少了備援（首次執行就是因為只有 Gemini 而卡住）。
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          DAILY_POOL: ${{ github.event.inputs.daily_pool || '60' }}
          DAILY_AI: ${{ github.event.inputs.daily_ai || '25' }}
        run: node scripts/daily-market.mjs

      - name: AI 分析（僅處理有新事件者，額度用完自動停止）
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          MAX_ANALYSES: ${{ github.event.inputs.max_analyses || '40' }}
          # 逐字稿路徑每家多花 15~30 秒，設上限避免整輪執行時間爆掉
          TRANSCRIPT_MAX: ${{ github.event.inputs.transcript_max || '12' }}
          NODE_PATH: scripts/node_modules
        run: node scripts/analyze-earnings.mjs

      - name: 提交結果
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "今日無新資料，不產生 commit"
          else
            n=$(git diff --staged --name-only | grep -c '^data/ai/' || true)
            git commit -m "自動更新：新增 ${n} 家公司的法說會 AI 分析

          由 GitHub Actions 每日排程產生，資料來源為 SEC EDGAR 與
          TWSE/TPEx 官方 OpenAPI，AI 分析使用 Gemini 免費層。"
            # 期間若有其他 commit（例如人工批次），先 rebase 再推，避免覆蓋他人變更
            git pull --rebase --autostash origin main
            git push
          fi
